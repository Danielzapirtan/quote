<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymarket Quotations</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; padding: 24px; }
  h1 { font-size: 1.3rem; margin-bottom: 20px; color: #333; }
  .search-bar { display: flex; gap: 8px; margin-bottom: 24px; }
  input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
  button { padding: 10px 18px; background: #4f46e5; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
  button:hover { background: #4338ca; }
  #results { display: flex; flex-direction: column; gap: 14px; }
  .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .card h2 { font-size: 1rem; margin-bottom: 10px; line-height: 1.4; }
  .outcomes { display: flex; flex-wrap: wrap; gap: 8px; }
  .outcome { display: flex; flex-direction: column; align-items: center; background: #f0f0ff; border-radius: 6px; padding: 8px 14px; min-width: 80px; }
  .outcome .label { font-size: 0.75rem; color: #555; margin-bottom: 2px; }
  .outcome .prob { font-size: 1.2rem; font-weight: 700; color: #4f46e5; }
  .outcome.yes .prob { color: #16a34a; }
  .outcome.no .prob { color: #dc2626; }
  .volume { font-size: 0.78rem; color: #888; margin-top: 8px; }
  .status { color: #888; font-size: 0.95rem; padding: 8px 0; }
  .error { color: #dc2626; font-size: 0.95rem; }
  a.link { font-size: 0.8rem; color: #4f46e5; text-decoration: none; display: inline-block; margin-top: 8px; }
  a.link:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>Polymarket — Read-Only Quotations</h1>
<div class="search-bar">
  <input type="text" id="query" placeholder="Search markets (e.g. election, bitcoin, recession...)" />
  <button onclick="search()">Search</button>
</div>
<div id="results"></div>

<script>
const GAMMA_API = "https://gamma-api.polymarket.com";

function fmt(n) {
  if (n === undefined || n === null || n === "") return "—";
  const p = parseFloat(n);
  if (isNaN(p)) return "—";
  return (p * 100).toFixed(1) + "%";
}

function fmtVol(n) {
  if (!n) return "";
  const v = parseFloat(n);
  if (isNaN(v)) return "";
  if (v >= 1_000_000) return `Vol: $${(v/1_000_000).toFixed(1)}M`;
  if (v >= 1_000) return `Vol: $${(v/1_000).toFixed(0)}K`;
  return `Vol: $${v.toFixed(0)}`;
}

function setStatus(msg, isError = false) {
  const el = document.getElementById("results");
  el.innerHTML = `<div class="${isError ? "error" : "status"}">${msg}</div>`;
}

async function search() {
  const query = document.getElementById("query").value.trim();
  if (!query) return;

  setStatus("Searching…");

  try {
    const url = `${GAMMA_API}/markets?limit=20&active=true&closed=false&_c=${encodeURIComponent(query)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const markets = Array.isArray(data) ? data : (data.markets || []);

    const filtered = markets.filter(m =>
      m.question && m.question.toLowerCase().includes(query.toLowerCase())
    ).slice(0, 15);

    if (!filtered.length) {
      setStatus("No active markets found for that query.");
      return;
    }

    render(filtered);
  } catch (e) {
    setStatus("Error fetching data. The API may be temporarily unavailable, or CORS may block browser requests. Try again or use a local proxy. (" + e.message + ")", true);
  }
}

function render(markets) {
  const el = document.getElementById("results");
  el.innerHTML = "";

  for (const m of markets) {
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("h2");
    title.textContent = m.question || "Untitled";
    card.appendChild(title);

    const outcomesEl = document.createElement("div");
    outcomesEl.className = "outcomes";

    // outcomes + prices
    let outcomes = [];
    try { outcomes = JSON.parse(m.outcomes || "[]"); } catch {}
    let prices = [];
    try { prices = JSON.parse(m.outcomePrices || "[]"); } catch {}

    if (outcomes.length) {
      outcomes.forEach((label, i) => {
        const div = document.createElement("div");
        const lc = label.toLowerCase();
        div.className = "outcome" + (lc === "yes" ? " yes" : lc === "no" ? " no" : "");
        div.innerHTML = `<span class="label">${label}</span><span class="prob">${fmt(prices[i])}</span>`;
        outcomesEl.appendChild(div);
      });
    } else if (m.outcomePrices) {
      // binary fallback
      const p = parseFloat(m.outcomePrices);
      if (!isNaN(p)) {
        outcomesEl.innerHTML = `
          <div class="outcome yes"><span class="label">Yes</span><span class="prob">${(p*100).toFixed(1)}%</span></div>
          <div class="outcome no"><span class="label">No</span><span class="prob">${((1-p)*100).toFixed(1)}%</span></div>`;
      }
    }

    card.appendChild(outcomesEl);

    if (m.volume) {
      const vol = document.createElement("div");
      vol.className = "volume";
      vol.textContent = fmtVol(m.volume);
      card.appendChild(vol);
    }

    if (m.conditionId || m.slug) {
      const slug = m.slug || m.conditionId;
      const link = document.createElement("a");
      link.className = "link";
      link.href = `https://polymarket.com/event/${slug}`;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "View on Polymarket ↗";
      card.appendChild(link);
    }

    el.appendChild(card);
  }
}

document.getElementById("query").addEventListener("keydown", e => {
  if (e.key === "Enter") search();
});
</script>
</body>
</html>
