<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manifold Markets Quotes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 0.25rem;
      color: #4f46e5;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      max-width: 700px;
      margin: 0 auto 1.5rem;
      align-items: center;
    }

    .controls input {
      flex: 1;
      min-width: 180px;
      padding: 0.55rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .controls input:focus { border-color: #4f46e5; }

    .controls select {
      padding: 0.55rem 0.6rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.9rem;
      background: #fff;
      outline: none;
      cursor: pointer;
    }

    .controls button {
      padding: 0.55rem 1.2rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .controls button:hover { background: #4338ca; }
    .controls button:disabled { background: #a5b4fc; cursor: not-allowed; }

    #status {
      text-align: center;
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      min-height: 1.2em;
    }

    #status.error { color: #dc2626; }

    .results {
      display: grid;
      gap: 1rem;
      max-width: 700px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 1rem 1.2rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border-left: 4px solid #4f46e5;
    }

    .card-question {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      line-height: 1.4;
    }

    .card-question a {
      color: #1a1a1a;
      text-decoration: none;
    }

    .card-question a:hover { text-decoration: underline; color: #4f46e5; }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: #555;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .badge-prob {
      background: #ede9fe;
      color: #5b21b6;
    }

    .badge-yes  { background: #dcfce7; color: #166534; }
    .badge-no   { background: #fee2e2; color: #991b1b; }
    .badge-na   { background: #f1f5f9; color: #475569; }

    .badge-type {
      background: #f0f9ff;
      color: #0369a1;
    }

    .card-creator { color: #888; }

    .empty {
      text-align: center;
      color: #888;
      margin-top: 2rem;
      font-size: 0.95rem;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #a5b4fc;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<h1>Manifold Markets Explorer</h1>
<p class="subtitle">Search prediction markets and browse live probabilities</p>

<div class="controls">
  <input
    id="searchInput"
    type="text"
    placeholder="Search markets (e.g. AI, election, crypto…)"
    autocomplete="off"
  />
  <select id="sortSelect">
    <option value="score">Top Scored</option>
    <option value="newest">Newest</option>
    <option value="liquidity">Most Liquid</option>
    <option value="close-date">Closing Soon</option>
    <option value="last-updated">Recently Updated</option>
  </select>
  <button id="searchBtn">Search</button>
</div>

<div id="status"></div>
<div id="results" class="results"></div>

<script>
  const API_BASE = 'https://api.manifold.markets/v0';

  const input   = document.getElementById('searchInput');
  const sortSel = document.getElementById('sortSelect');
  const btn     = document.getElementById('searchBtn');
  const status  = document.getElementById('status');
  const results = document.getElementById('results');

  async function fetchMarkets(query, sort) {
    const params = new URLSearchParams({ limit: 20, sort });
    if (query) params.set('term', query);
    const url = `${API_BASE}/search-markets?${params}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`API error: ${res.status} ${res.statusText}`);
    return res.json();
  }

  function probBadge(market) {
    const t = market.outcomeType;
    if (t === 'BINARY' && typeof market.probability === 'number') {
      const pct = Math.round(market.probability * 100);
      const cls = pct >= 60 ? 'badge-yes' : pct <= 40 ? 'badge-no' : 'badge-prob';
      return `<span class="badge ${cls}">${pct}% YES</span>`;
    }
    if (t === 'PSEUDO_NUMERIC' && typeof market.probability === 'number') {
      return `<span class="badge badge-prob">~${market.probability.toFixed(2)}</span>`;
    }
    return '';
  }

  function typeBadge(outcomeType) {
    const labels = {
      BINARY: 'Yes/No',
      FREE_RESPONSE: 'Free response',
      MULTIPLE_CHOICE: 'Multiple choice',
      NUMERIC: 'Numeric',
      PSEUDO_NUMERIC: 'Numeric',
      STONK: 'Stonk',
      BOUNTIED_QUESTION: 'Bounty',
      POLL: 'Poll',
    };
    const label = labels[outcomeType] || outcomeType;
    return `<span class="badge badge-type">${label}</span>`;
  }

  function formatDate(ts) {
    if (!ts) return '';
    return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function renderCards(markets) {
    if (!markets.length) {
      results.innerHTML = '<p class="empty">No markets found. Try a different search.</p>';
      return;
    }

    results.innerHTML = markets.map(m => {
      const closeStr = m.closeTime ? `Closes ${formatDate(m.closeTime)}` : '';
      const creator  = m.creatorName ? `by ${m.creatorName}` : '';
      const url      = m.url || `https://manifold.markets/market/${m.slug}`;

      return `
        <div class="card">
          <div class="card-question">
            <a href="${url}" target="_blank" rel="noopener noreferrer">${m.question}</a>
          </div>
          <div class="card-meta">
            ${typeBadge(m.outcomeType)}
            ${probBadge(m)}
            ${closeStr ? `<span>${closeStr}</span>` : ''}
            ${creator  ? `<span class="card-creator">${creator}</span>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  async function doSearch() {
    const query = input.value.trim();
    const sort  = sortSel.value;

    btn.disabled = true;
    status.className = '';
    status.innerHTML = '<span class="spinner"></span>Fetching markets…';
    results.innerHTML = '';

    try {
      const markets = await fetchMarkets(query, sort);
      status.textContent = `${markets.length} market${markets.length !== 1 ? 's' : ''} found`;
      renderCards(markets);
    } catch (err) {
      status.className = 'error';
      status.textContent = `Error: ${err.message}`;
    } finally {
      btn.disabled = false;
    }
  }

  btn.addEventListener('click', doSearch);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  // Load trending on startup
  doSearch();
</script>
</body>
</html>
